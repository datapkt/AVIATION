<text x="608" y="484" font-size="15" font-weight="700" fill="#bc2c3c" text-anchor="start">Land boundary</text>
<text x="608" y="503" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">Railway land limit, boundary pillars</text>
<line x1="516.0" y1="592" x2="600" y2="592" stroke="#4a4a4a" stroke-width="1"/>
<circle cx="516.0" cy="592" r="2.5" fill="#4a4a4a"/>
<text x="608" y="590" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="start">Survey base</text>
<text x="608" y="609" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">Orthomosaic and DTM on control</text>
<text x="50" y="676" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">Each layer is a separate sheet on the same survey control, so the ESP can be issued and updated layer by layer.</text>
</svg>
