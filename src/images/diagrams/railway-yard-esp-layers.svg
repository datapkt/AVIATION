<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="d7-t d7-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d7-t">Layers of a railway yard Engineering Scale Plan (ESP)</title>
<desc id="d7-d">Exploded view of six stacked sheets that share the same control. From top: tracks (running lines, loops, sidings); points and crossings; structures such as platforms, buildings, foot over bridges and culverts; drainage lines with flow direction; the railway land boundary with boundary pillars; and the survey base of orthomosaic and DTM.</desc>
