<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="d2-t d2-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d2-t">Drone photogrammetry processing chain</title>
<desc id="d2-d">Flow diagram. Ground control points, overlapping images and RTK or PPK camera positions feed aerial triangulation and bundle adjustment. This produces a dense point cloud, then a DSM and DTM, then an orthomosaic, then contours, CAD and GIS layers. Checkpoints held out of the adjustment are compared with the outputs in a final QA step; if residuals exceed the tolerance, control is re-checked and the adjustment is re-run.</desc>
<defs><marker id="d2-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="d2-ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc2c3c"/></marker><marker id="d2-ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/></marker><marker id="d2-tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5,0 L5,10" stroke="#1e1e1e" stroke-width="1.6"/></marker></defs>
<rect width="900" height="760" fill="#fff"/>
<text x="30" y="18" font-size="12" font-weight="700" fill="#4a4a4a" text-anchor="start" letter-spacing="1.5">INPUTS</text>
<rect x="30" y="28" width="260" height="80" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="160.0" y="53.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Ground control points</text><text x="160.0" y="76.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="middle"><tspan x="160.0" dy="0">Surveyed targets; some</tspan><tspan x="160.0" dy="17">held out as checkpoints</tspan></text>
<rect x="320" y="28" width="260" height="80" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="450.0" y="53.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Overlapping images</text><text x="450.0" y="76.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="middle"><tspan x="450.0" dy="0">Front and side overlap</tspan><tspan x="450.0" dy="17">set for the target GSD</tspan></text>
<rect x="610" y="28" width="260" height="80" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/><text x="740.0" y="53.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Camera positions</text><text x="740.0" y="76.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="middle"><tspan x="740.0" dy="0">GNSS with RTK or PPK</tspan><tspan x="740.0" dy="17">corrections</tspan></text>
<path d="M180,108 C180,130 340,128 340,150" stroke="#1e1e1e" stroke-width="1.5" fill="none" marker-end="url(#d2-ah)"/>
<line x1="450" y1="108" x2="450" y2="150" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<path d="M720,108 C720,130 560,128 560,150" stroke="#1e1e1e" stroke-width="1.5" fill="none" marker-end="url(#d2-ah)"/>
<rect x="270" y="152" width="360" height="66" rx="6" fill="#fff" stroke="#bc2c3c" stroke-width="2"/><text x="450.0" y="178.8" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Aerial triangulation</text><text x="450.0" y="201.4" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="middle">Bundle adjustment</text>
<text x="652" y="172.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">Ties images together; solves</tspan><tspan x="652" dy="18">camera position, orientation</tspan><tspan x="652" dy="18">and lens calibration</tspan></text>
<line x1="450" y1="218" x2="450" y2="262" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<rect x="270" y="264" width="360" height="56" rx="6" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1.2"/><text x="450.0" y="297.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Dense point cloud</text>
<text x="652" y="288.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">Image matching gives a 3D</tspan><tspan x="652" dy="18">point for most pixels</tspan></text>
<line x1="450" y1="320" x2="450" y2="364" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<rect x="270" y="366" width="360" height="56" rx="6" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1.2"/><text x="450.0" y="399.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">DSM and DTM</text>
<text x="652" y="390.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">DSM: top surface with objects</tspan><tspan x="652" dy="18">DTM: bare ground after filtering</tspan></text>
<line x1="450" y1="422" x2="450" y2="466" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<rect x="270" y="468" width="360" height="56" rx="6" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1.2"/><text x="450.0" y="501.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Orthomosaic</text>
<text x="652" y="492.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">Images corrected for relief</tspan><tspan x="652" dy="18">and stitched at true scale</tspan></text>
<line x1="450" y1="524" x2="450" y2="568" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<rect x="270" y="570" width="360" height="56" rx="6" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1.2"/><text x="450.0" y="603.2" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Contours, CAD and GIS layers</text>
<text x="652" y="594.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">Contours from the DTM;</tspan><tspan x="652" dy="18">features digitised to CAD/GIS</tspan></text>
<line x1="450" y1="626" x2="450" y2="670" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d2-ah)"/>
<rect x="270" y="672" width="360" height="66" rx="6" fill="#bc2c3c"/><text x="450.0" y="698.8" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Checkpoint QA</text><text x="450.0" y="721.5" font-size="13" font-weight="400" fill="#fbe9eb" text-anchor="middle">Residuals and RMSE vs. tolerance</text>
<text x="652" y="701.0" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start"><tspan x="652" dy="0">Pass: issue deliverables</tspan><tspan x="652" dy="18">with the accuracy report</tspan></text>
<path d="M80,108 L80,705 L266,705" stroke="#1e1e1e" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#d2-ah)"/>
<text x="92" y="400" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="start"><tspan x="92" dy="0">Checkpoints</tspan><tspan x="92" dy="18">held out of</tspan><tspan x="92" dy="18">adjustment</tspan></text>
<path d="M270,720 L238,720 L238,185 L266,185" stroke="#bc2c3c" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#d2-ahr)"/>
<text x="226" y="452" font-size="13" font-weight="700" fill="#bc2c3c" text-anchor="middle" transform="rotate(-90 226 452)">Fail: re-check control and re-run</text>
</svg>
