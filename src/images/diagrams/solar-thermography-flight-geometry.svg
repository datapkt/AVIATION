<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="d6-t d6-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d6-t">Drone thermography of a solar PV plant: viewing angle, irradiance and pixel footprint</title>
<desc id="d6-d">Side view of tilted module rows with a drone carrying a thermal camera above them. The line of sight meets the module plane at viewing angle theta, which should be more than 30 degrees and steep, but just off perpendicular so the drone does not reflect in the glass. An irradiance sensor is mounted in the plane of the modules. An inset shows one solar cell covered by about five by five thermal pixels. A checklist gives the IEC TS 62446-3 capture conditions: irradiance of at least 600 W/m2 in the module plane and steady, viewing angle above 30 degrees, about 3 cm of module edge per pixel or finer, and low wind, little cloud and no reflections.</desc>
