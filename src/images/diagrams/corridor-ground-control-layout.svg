<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="d1-t d1-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d1-t">Ground control layout for a highway or railway corridor survey</title>
<desc id="d1-d">Plan view of a linear corridor. Ground control points alternate on the left and right sides of the alignment in a zig-zag, with a pair at each end. Checkpoints sit between them and are held out of the adjustment for accuracy checks. Chainage ticks mark the centre line at a fixed interval, and a GNSS base station sits on known control beside the corridor.</desc>
