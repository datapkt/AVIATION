<line x1="735" y1="266.8" x2="723" y2="266.8" stroke="#4a4a4a" stroke-width="1"/>
<text x="719" y="263.8" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="end"><tspan x="719" dy="0">1st return</tspan><tspan x="719" dy="16">(canopy top)</tspan></text>
<circle cx="745" cy="322" r="6" fill="#bc2c3c" stroke="#fff" stroke-width="1.5"/>
<line x1="735" y1="322" x2="723" y2="322" stroke="#4a4a4a" stroke-width="1"/>
<text x="719" y="319" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="end"><tspan x="719" dy="0">2nd return</tspan><tspan x="719" dy="16">(branch)</tspan></text>
<circle cx="745" cy="402" r="6" fill="#bc2c3c" stroke="#fff" stroke-width="1.5"/>
<line x1="735" y1="402" x2="723" y2="402" stroke="#4a4a4a" stroke-width="1"/>
<text x="719" y="399" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="end"><tspan x="719" dy="0">3rd return</tspan><tspan x="719" dy="16">(lower canopy)</tspan></text>
<circle cx="745" cy="600" r="6" fill="#bc2c3c" stroke="#fff" stroke-width="1.5"/>
<text x="719" y="574" font-size="13" font-weight="400" fill="#1e1e1e" text-anchor="end"><tspan x="719" dy="0">Last return</tspan><tspan x="719" dy="16">(ground)</tspan></text>
<text x="730" y="640" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="middle"><tspan x="730" dy="0">Ground returns under the canopy</tspan><tspan x="730" dy="18">give a true DTM where</tspan><tspan x="730" dy="18">photogrammetry sees only</tspan><tspan x="730" dy="18">the tree tops</tspan></text>
</svg>
