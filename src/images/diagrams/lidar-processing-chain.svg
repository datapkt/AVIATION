<line x1="676" y1="600" x2="668" y2="610" stroke="#8a8a8a" stroke-width="1"/>
<line x1="690" y1="600" x2="682" y2="610" stroke="#8a8a8a" stroke-width="1"/>
<line x1="704" y1="600" x2="696" y2="610" stroke="#8a8a8a" stroke-width="1"/>
<line x1="718" y1="600" x2="710" y2="610" stroke="#8a8a8a" stroke-width="1"/>
