<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="d5-t d5-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d5-t">Transmission line clearance: sag, ground clearance and right-of-way width</title>
<desc id="d5-d">Top: elevation of one span between two lattice towers. The conductor hangs in a sag curve below the chord line joining the attachment points; sag is the vertical distance from chord to conductor, minimum ground clearance is measured from the conductor to the highest ground under it, and vegetation clearance from the conductor to the tree top. Bottom: cross-section at a tower showing the conductors on the cross-arms, the line centre line, the right-of-way corridor width between its two edges, and horizontal clearance from the outer conductor to a tree inside the corridor.</desc>
