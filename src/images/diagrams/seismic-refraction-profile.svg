<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-labelledby="d8-t d8-d" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<title id="d8-t">Seismic refraction survey: geophone spread, ray paths and two-layer velocity model</title>
<desc id="d8-d">Bottom: cross-section with a shot point at the left end of a line of geophones on the ground surface. A direct wave travels through the upper layer with velocity V1. A refracted wave travels down at the critical angle, along the interface with the faster lower layer of velocity V2, and back up to the far geophones; sin of the critical angle equals V1 over V2. Top: travel-time plot of first arrivals against distance, with a direct-wave line of slope 1/V1, a refracted line of slope 1/V2, and the crossover distance where the refracted wave arrives first.</desc>
